<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bargou GYM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="image/png">
</head>
<body>
    <center>
    <header id="content">
        <img class="logo" src="img/unnamed-removebg-preview.png" alt="" width="70px">
        <br>
        <hr>
        <div class="members" id="mem">
        <div class="mm">
            <img class="mem" src="img/icons8-team-50.png" alt="" width="50px">
            <h1>Bargou Gym member list</h1>
        </div>
        <nav>
            <img class="sec" src="img/icons8-profile-50 (1).png" alt="" width="50px">
            <h1>Feres Dridi</h1>
            <button onclick="ceo()"><p class="det">Owner Ship</p> <img class="dett" src="img/icons8-gym-50.png" alt=""></button>
        </nav>
        <div class="add">
            <button onclick="mem()"><img src="img/icons8-add-48 (2).png" alt="" width="24px">Add</button>
        </div>
        </div>
        <div class="ajouter" id="addd">
            <button class="X" onclick="X()">X</button>
        <div class="mm">
            <img class="mem" src="img/icons8-add-member-48.png" alt="" width="50px">
            <h1>Add new member</h1>
        </div>
            <section>
            <form action="" method="get">
              <div class="form">
                <label for="name"><div class="la"><img src="img/icons8-name-48.png" alt="" width="30px"><strong>Full Name</strong></div></label>
                <input type="text" required>
                <label for="date"><div class="la"><img src="img/icons8-date-48.png" alt="" width="30px"><strong>Date</strong></div></label>
                <input type="date" name="date" id="date"  required>
                <label for="tel"><div class="la"><img src="img/icons8-phone-48.png" alt="" width="30px"><strong>Phone Nember</strong></div></label>
                <input type="tel" name="tel" id="date"  required>
                <label for="sex"><div class="la"><img src="img/icons8-sex-48.png" alt="" width="30px"><strong>Sex</strong></div></label>
                <select class="sel" id="sex"  required>
                    <option value="men">Men</option>
                    <option value="men">Women</option>
                </select>
                </div>
                <br>
                <br>
                <hr>
                <br>
                <input type="submit" value="Submit" id="suv">
                <input type="button" value="Cancel" onclick="window.location.href='/'" id="suv">
                
            </form>
            </section>
            </div>
          <div class="detail" id="det">
            <div class="person">
              <button class="XX" id="X" onclick="XX()">X</button>
              <img src="img/2025 Vision Board.jfif" alt="" width="98%" class="banner">
            <img class="imgowner" src="img/Screenshot_20260311-005331_Facebook.jpg" alt="" width="50%" height="auto">
            </div>
            <div class="info">
            <div class="information">
            <h1><div class="laa"><img src="img/icons8-name-48.png" alt="" width="50px"><strong>Fares Dridi</strong></div></h1>
            <h1><div class="laa"><img src="img/icons8-rating-48.png" alt="" width="50px"><strong>founder</strong></div></h1>
            </div>
            <div class="information">
            <h1><div class="laa"><img src="img/icons8-phone-48.png" alt="" width="40px"><span>+216 </span><strong>24146746</strong></div></h1>
            </div>
            </div>
          </div>
          <div class="detail" id="dt">
            <div class="person">
              <button class="XX" id="X" onclick="XX()">X</button>
              <img src="img/2025 Vision Board.jfif" alt="" width="98%" class="banner">
            <img class="imgoper" src="img/820d7848bc397215470463b51e6ac26c-removebg-preview (1).png" alt="" width="30%">
            </div>
            <div class="info">
            <div class="information">
            <h1><div class="laa"><img src="img/icons8-name-48.png" alt="" width="50px"><strong>Fares Dridi</strong></div></h1>
            <h1><div class="laa"><img src="img/icons8-rating-48.png" alt="" width="50px"><strong>founder</strong></div></h1>
            </div>
            <div class="information">
            <h1><div class="laa"><img src="img/icons8-phone-48.png" alt="" width="40px"><span>+216 </span><strong>24146746</strong></div></h1>
            </div>
            </div>
          </div>
    </header>
</center>
    <div id="loading">
  <div class="spinner"></div>
</div>




<script>

  function mem() {
    document.getElementById('mem').style.display = 'none';
    document.getElementById('addd').style.display = 'block';
  }
  function ceo() {
    document.getElementById('mem').style.display = 'none';
    document.getElementById('det').style.display = 'block';
  }


  function X() {
    document.getElementById('mem').style.display = 'block';
    document.getElementById('addd').style.display = 'none';
  }
  function XX() {
    document.getElementById('mem').style.display = 'block';
    document.getElementById('det').style.display = 'none';
  }


  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }, 1500); // 1.5 seconds
  });


  const form = document.querySelector('#addd form');
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const fullName = form.querySelector('input[type="text"]').value;
    const sex = form.querySelector('#sex').value;
    const logoSrc = sex === 'men' ? 'img/icons8-profile-50 (1).png' : 'img/icons8-profile-50-female.png';

    const newMember = {
      name: fullName,
      logo: logoSrc
    };


    const savedMembers = JSON.parse(localStorage.getItem('members')) || [];
    savedMembers.push(newMember);
    localStorage.setItem('members', JSON.stringify(savedMembers));

    const nav = document.createElement('nav');
    nav.innerHTML = `
      <img class="sec" src="${logoSrc}" alt="" width="50px">
      <h1>${fullName}</h1>
      <button><p class="det">Details</p> <img class="dett" src="img/icons8-detail-50.png" alt=""></button>
    `;
    document.getElementById('mem').appendChild(nav);

    form.reset();
    X();
function changePage(){
    document.getElementById("mem").classList.remove("active");
    document.getElementById("addd").classList.add("active");
}
  });
</script>
</body>
</html>
